server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve lazily so the standalone schedule preview also works without backend.
    location /backend-api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $zapara_backend api:8000;
        rewrite ^/backend-api/(.*)$ /api/v1/$1 break;
        proxy_pass http://$zapara_backend;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass https://rasp.omgtu.ru/api/;
        proxy_set_header Host rasp.omgtu.ru;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 20s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve lazily so the frontend can also be built without the backend service.
    location /backend-api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $zapara_backend api:8000;
        rewrite ^/backend-api/(.*)$ /api/v1/$1 break;
        proxy_pass http://$zapara_backend;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://rasp.omgtu.ru/api/;
        proxy_set_header Host rasp.omgtu.ru;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 20s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
